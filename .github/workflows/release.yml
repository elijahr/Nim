name: Release
on:
  push:
    tags: [ 'v*', '*-test*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to triggering ref)'
        required: false
        default: ''
permissions:
  contents: write

jobs:
  build:
    uses: elijahr/nightlies/.github/workflows/build.yml@validation   # validation: branch ref; pin to SHA in Task 13
    with:
      source_repo: ${{ github.repository }}        # elijahr/Nim
      ref: ${{ github.event.inputs.ref || github.sha }}
      matrix_subset: '["x86_64-linux-musl"]'       # Tranche 1: proven single target only (widened per tranche)
    secrets: inherit

  release:
    needs: [ build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # F6: download binaries-* WITHOUT merge-multiple so each artifact lands in its own
      # binaries-<triple>/ subdir under bin/ — this is what makes the guard's dir-count meaningful.
      - name: Download per-triple binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'binaries-*'
          path: bin            # → bin/binaries-<triple>/<file> per artifact (NO merge-multiple)
      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.source_artifact }}
          path: src            # → src/<source tarball>
      - name: Guard — require all 8 binaries for real releases
        if: startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          # F6: count per-artifact dirs (one dir per triple). With merge-multiple this
          # would flatten to loose files and miscount; without it, each triple is a dir.
          count=$(find bin -mindepth 1 -maxdepth 1 -type d -name 'binaries-*' | wc -l | tr -d ' ')
          echo "Found $count binaries-* artifact dirs:"; ls -la bin || true
          if [ "$count" -ne 8 ]; then
            echo "::error::real v* release requires 8 binaries-* artifacts, found $count"
            exit 1
          fi
      - name: Assemble release assets
        shell: bash
        run: |
          # Flatten the per-triple dirs + source tarball into one assets/ dir for upload.
          mkdir -p assets
          find bin -mindepth 2 -type f -exec cp -t assets {} +
          cp src/* assets/
          echo "Release assets:"; ls -la assets
      - name: Create or update release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_id) }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          notes="Release build for commit https://github.com/${{ github.repository }}/commit/$COMMIT"
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release upload "$TAG" --repo '${{ github.repository }}' --clobber assets/*
          else
            gh release create "$TAG" --repo '${{ github.repository }}' --title "$TAG" --notes "$notes" assets/*
          fi
